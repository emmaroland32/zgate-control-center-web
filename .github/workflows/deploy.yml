name: Deploy to AWS ECR, EC2

# Builds the Control-Center web (Next.js standalone) image, pushes to ECR, then
# `docker compose up -d controlcenter-web` on the host. Requires repo secrets:
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, SSH_HOST, SSH_USER, SSH_PRIVATE_KEY,
# SSH_PORT (optional), DEPLOY_PATH.
#
# The browser no longer calls the CC API directly: it calls same-origin /api/cc and the BFF
# (web/src/server/bff/cc-proxy.ts) attaches the operator's token server-side. So the value that
# matters at RUNTIME is CC_BACKEND_URL, set in the host's docker-compose.yml (or its .env) — the
# internal address, http://controlcenter-backend:8090. With it unset the proxy falls back to the
# baked NEXT_PUBLIC_API_URL, which still resolves (it is the public API host) but sends every call out
# and back in through the edge instead of across the docker network.
#
# NEXT_PUBLIC_API_URL remains a BUILD-time build-arg because that is how NEXT_PUBLIC_* works; nothing
# in the client bundle reads it any more. Change it via repo variable NEXT_PUBLIC_API_URL.

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '.vscode/**'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    env:
      COSIGN_ENABLED: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
    outputs:
      ecr-registry: ${{ steps.login-ecr.outputs.registry }}
      ecr-repository: zgate-control-center-web
      image-tag: latest
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names zgate-control-center-web --region eu-west-2 \
            || aws ecr create-repository --repository-name zgate-control-center-web --region eu-west-2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to Amazon ECR
        id: build
        uses: docker/build-push-action@v6
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: zgate-control-center-web
          IMAGE_TAG: latest
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://control-center-api-dev.eradiuxtech.com' }}
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      # Sign the image by digest with the ZGATE release key. No-op until COSIGN_PRIVATE_KEY is set.
      - name: Install cosign
        if: env.COSIGN_ENABLED == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign and verify image
        if: env.COSIGN_ENABLED == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
          IMAGE_REF: ${{ steps.login-ecr.outputs.registry }}/zgate-control-center-web@${{ steps.build.outputs.digest }}
        run: |
          set -e
          cosign sign --key env://COSIGN_PRIVATE_KEY --yes "$IMAGE_REF"
          if [ -n "$COSIGN_PUBLIC_KEY" ]; then
            printf '%s' "$COSIGN_PUBLIC_KEY" > cosign.pub
            cosign verify --key cosign.pub "$IMAGE_REF"
          fi
          echo "[cosign] signed + verified $IMAGE_REF"

  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    needs: build
    environment: development
    steps:
      - name: Deploy on server over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-west-2
          ECR_REGISTRY: ${{ needs.build.outputs.ecr-registry }}
          ECR_REPOSITORY: ${{ needs.build.outputs.ecr-repository }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,DEPLOY_PATH
          # script_stop is OFF, and must stay off. It makes drone-ssh inject
          #     DRONE_SSH_PREV_COMMAND_EXIT_CODE=$?
          #     [ $DRONE_SSH_PREV_COMMAND_EXIT_CODE -ne 0 ] && exit ...
          # after EVERY command — including the test of an `if`. A conditional that evaluates
          # false exits 1, which is indistinguishable from a command that failed, so the step
          # died on the plain `elif [ "$health" = "unhealthy" ]` the moment health was anything
          # but healthy. Caught under `set -x` on 2026-10-31:
          #     + '[' none = healthy ']'
          #     + '[' none = unhealthy ']'
          #     + DRONE_SSH_PREV_COMMAND_EXIT_CODE=1
          #     + exit 1
          # That is also what mangled the earlier `case` form into a `;;;` syntax error, and why
          # the one green run was the one where the container was ALREADY healthy — the first
          # `if` returned 0 and never tripped the guard. Red for four days over working deploys.
          # `set -e` on line 1 is the correct mechanism: bash deliberately does not trip it on a
          # test used as a condition.
          script: |
            set -e
            IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            echo "[deploy] image=$IMAGE"
            aws ecr get-login-password --region "$AWS_REGION" \
              | sudo docker login --username AWS --password-stdin "$ECR_REGISTRY"
            sudo docker pull "$IMAGE"
            cd "$DEPLOY_PATH"
            # `up -d` exits non-zero even when the roll worked. On 2026-10-31 at 04:19:04 it
            # recreated and started the backend, the container went healthy and is still serving —
            # and this step died half a second later under `set -e`, printing not one word, because
            # compose returned 1. A silent exit over a working deploy is worse than no gate at all:
            # it hid a disk at 100% for four days. So compose's exit code is now ADVISORY and logged,
            # and the health gate below is the sole authority on whether the roll worked — that is
            # the question we actually care about, and it answers it directly.
            set +e
            sudo docker compose up -d controlcenter-web
            up_rc=$?
            set -e
            echo "[deploy] compose up exit=$up_rc"
            if [ "$up_rc" -ne 0 ]; then
              echo "[deploy] compose up reported failure; the health gate below decides."
              sudo docker compose logs --tail 30 controlcenter-web || true
            fi

            # `up -d` returns when the container STARTS, not when it works. Without this a
            # deploy reports success over a container that died seconds later — a bad build or missing runtime config, and
            # Fail the deploy instead of leaving a green tick on a dead service.
            # `|| true` matters: under `set -e` a failing command substitution aborts the whole
            # script BEFORE the message below can print. `ps -q` matches only RUNNING containers
            # and returns non-zero when there are none, so a service that starts and dies gives a
            # silent "exited with status 1". Fall back to `-aq` so the state check can show logs.
            cid=$(sudo docker compose ps -q controlcenter-web 2>/dev/null | head -n1 || true)
            if [ -z "$cid" ]; then
              cid=$(sudo docker compose ps -aq controlcenter-web 2>/dev/null | head -n1 || true)
            fi
            if [ -z "$cid" ]; then
              echo "[deploy] no container for controlcenter-web after up -d"
              exit 1
            fi
            settled=0
            ok=0
            for i in $(seq 1 30); do
              state=$(sudo docker inspect -f '{{.State.Status}}' "$cid" 2>&1) || {
                echo "[deploy] docker inspect failed for cid=[$cid]: $state"
                exit 1
              }
              health=$(sudo docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>&1) || {
                echo "[deploy] docker inspect (health) failed for cid=[$cid]: $health"
                exit 1
              }
              if [ "$state" != "running" ]; then
                echo "[deploy] container is $state, not running:"
                sudo docker logs --tail 50 "$cid" || true
                exit 1
              fi
              # if/elif, not case: this step runs with script_stop: true, and appleboy/ssh-action
              # rewrites the script so a line ending in a case-arm terminator becomes "fi ;;;".
              # bash then dies with "syntax error near unexpected token ';'" AFTER the container has
              # already started, so the deploy reports failure over a roll that succeeded. Red here
              # since 2026-10-27. Keep this block free of line-ending ";;".
              if [ "$health" = "healthy" ]; then
                echo "[deploy] healthy"
                ok=1
                break
              elif [ "$health" = "unhealthy" ]; then
                echo "[deploy] container reports unhealthy:"
                sudo docker logs --tail 50 "$cid" || true
                exit 1
              else
                # No healthcheck on this image, so "running" alone proves nothing: require it to
                # STAY up, which is how a boot-time failure shows itself.
                settled=$((settled + 1))
                if [ "$settled" -ge 6 ]; then
                  echo "[deploy] no healthcheck on this image; running steadily for 60s"
                  ok=1
                  break
                fi
              fi
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "[deploy] did not become healthy in time (last state=$state health=$health):"
              sudo docker logs --tail 50 "$cid" || true
              exit 1
            fi

            sudo docker image prune -f
            echo "[deploy] done"
